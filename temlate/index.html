<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handlebars</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <template id="person" type="text/x-handlebars-tempate"
      ><p>{{person.firstname}} {{person.lastname}}</p></template
    >

    <div id="person-template"></div>

    <template id="person-with" type="text/x-handlebars-tempate"
      >{{#with person}} {{firstname}} {{lastname}} {{/with}}
    </template>

    <div id="person-with-template"></div>

    <template id="people-list" type="text/x-handlebars-tempate"
      ><ul class="people_list">
        {{#each list}}
        <li>{{this.name}} {{this.age}} <br> <img src="{{this.img}}"  alt="img" width="450"></li>
        {{/each}}
      </ul></template
    >
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <div id="people-list-template"></div>
    <script>
      // compile the template
      var template = Handlebars.compile("Handlebars <b>{{doesWhat}}</b>");
      // execute the compiled template and print the output to the console
      console.log(template({ doesWhat: "rocks!" }));
    </script>
    <script type="module" src="./js/style.js"></script>
  </body>
</html>
