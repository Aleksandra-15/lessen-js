    <h1>Контактна книга</h1>
    <div id="contactForm">

        <input type="text" id="lastName" placeholder="Прізвище" required>

    <h2>Список контактів</h2>

    <h1>Закладки</h1>
    <div id="bookmarkForm">
        <input type="text" id="bookmarkTitle" placeholder="Назва закладки" required>
        <input type="url" id="bookmarkUrl" placeholder="URL посилання" required>
        <button onclick="addBookmark()">Додати закладку</button>
    </div>
